<html>
	<head>

			content="width=device-width, initial-scale=1, shrink-to-fit=no"

		<title>Commonground — Test Cube</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 0;
				background-color: #111;

			#ar-button {
				position: absolute;
				left: 50%;
				top: 50%;
				transform: translate(-50%, -50%);

				height: 50px;
				border-radius: 25px;
				border: 2px solid #fff;
				background-color: #1b4fd8;
				color: #fff;
				font-size: 1.2em;
				font-weight: bold;
				cursor: pointer;
				z-index: 1000;
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"three": "/node_modules/three/build/three.module.js",
					"three/": "/node_modules/three/",
					"ratk": "/node_modules/ratk/build/ratk.module.js",

					"troika-worker-utils": "/node_modules/troika-worker-utils/dist/troika-worker-utils.esm.js",

					"webgl-sdf-generator": "/node_modules/webgl-sdf-generator/dist/webgl-sdf-generator.mjs",
					"bidi-js": "/node_modules/bidi-js/dist/bidi.mjs"
				}
			}
		</script>
