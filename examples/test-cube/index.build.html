<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, shrink-to-fit=no"
		/>
		<title>Commonground — Test Cube</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 0;
				background-color: #111;
			}
			#ar-button {
				position: absolute;
				left: 50%;
				top: 50%;
				transform: translate(-50%, -50%);
				width: 300px;
				height: 50px;
				border-radius: 25px;
				border: 2px solid #fff;
				background-color: #1b4fd8;
				color: #fff;
				font-size: 1.2em;
				font-weight: bold;
				cursor: pointer;
				z-index: 1000;
			}
		</style>
	</head>
	<body>
		<div id="scene-container"></div>
		<button id="ar-button"></button>
	</body>
</html>
