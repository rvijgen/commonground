# DirectAdmin Custom HTTPD Configuration for CommonGround
# Paste into: DirectAdmin > Custom HTTPD Configurations > select domain > Custom Httpd (HTTPS)
# Required Apache modules: proxy, proxy_http, proxy_wstunnel, rewrite

# Proxy /commonground to Node.js HTTP server on port 3001
ProxyPass /commonground http://localhost:3001/
ProxyPassReverse /commonground http://localhost:3001/

# Additional paths needed for dev mode (no-build)
ProxyPass /node_modules http://localhost:3001/node_modules
ProxyPassReverse /node_modules http://localhost:3001/node_modules
ProxyPass /src http://localhost:3001/src
ProxyPassReverse /src http://localhost:3001/src
ProxyPass /examples http://localhost:3001/examples
ProxyPassReverse /examples http://localhost:3001/examples
ProxyPass /assets http://localhost:3001/assets
ProxyPassReverse /assets http://localhost:3001/assets
ProxyPass /api http://localhost:3001/api
ProxyPassReverse /api http://localhost:3001/api
ProxyPass /test-video http://localhost:3001/test-video
ProxyPassReverse /test-video http://localhost:3001/test-video
